name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "infra/terraform/app/**"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

# Merging several PRs in a row starts one run per merge. Each runs terraform apply against the same
# state, so they queue instead of racing for its lock; the newest run deploys everything merged.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  LAMBDA_ZIP_PATH: ${{ github.workspace }}/publish/function.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      # A broken build or a failing test never reaches AWS.
      - run: dotnet test api/FoodTrack.slnx --configuration Release

      - run: dotnet tool install -g Amazon.Lambda.Tools --version 7.0.0

      # ReadyToRun ships pre-compiled native code next to the IL, so a cold start skips most of the
      # JIT work instead of compiling the whole request path on the first call.
      - name: Package the Lambda function
        run: |
          dotnet lambda package \
            --project-location api/src/FoodTrack.Api \
            --configuration Release \
            --output-package "$LAMBDA_ZIP_PATH" \
            --msbuild-parameters "/p:PublishReadyToRun=true" \
            --disable-interactive true

      # This account is on AWS's "Free Plan", which blocks creating an OIDC provider (an AWS
      # Organizations guardrail on that account type) -- static keys for a narrowly-scoped IAM
      # user are the fallback. See infra/terraform/bootstrap/oidc.tf for the full reasoning.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # The workspace runs in Local execution mode, so Terraform Cloud workspace variables are
      # ignored; inputs must come from here, and TF_INPUT=false makes a missing one fail instead of
      # waiting forever for a prompt nobody can answer.
      - name: Terraform apply
        working-directory: infra/terraform/app
        env:
          TF_INPUT: "false"
          TF_VAR_lambda_execution_role_arn: ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}
          TF_VAR_meal_photos_bucket_name: ${{ secrets.MEAL_PHOTOS_BUCKET_NAME }}
        run: |
          terraform init
          terraform apply -auto-approve -var="lambda_zip_path=$LAMBDA_ZIP_PATH"

      - name: Smoke test
        working-directory: infra/terraform/app
        run: |
          function_url=$(terraform output -raw function_url)
          curl --fail --retry 5 --retry-delay 5 "${function_url}health"
